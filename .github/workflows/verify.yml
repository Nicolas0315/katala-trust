name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run verify:local
      - name: Host hook smoke
        run: node examples/host-hook-smoke.mjs
      - name: OpenClaw tool adapter smoke
        run: node examples/openclaw-tool-adapter-smoke.mjs
      - name: Host decision matrix
        run: node examples/host-decision-matrix.mjs
      - name: Blocked write demo
        run: node examples/blocked-write-demo.mjs
      - name: Trust eval v1
        run: node scripts/run-trust-eval.mjs
